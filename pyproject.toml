[project]
name = "transaction-webhook-service"
version = "1.0.0"
description = "Accept payment webhooks and process them in the background"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: sleeps for the real 30 second processing delay",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007", "UP017"]
